type: object
required:
  - _id
  - name
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: '65e4decdd286b30065d54af9'
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phoneNumber"
    type: string
    example: '+380980001122'
  contactType:
    description: "Contact's contact Type"
    type: string
    enum: ['personal', 'home', 'work']
    example: 'personal'
  email:
    description: "Contact's email"
    type: string
    example: "false@gmail.com"
  isFavourite:
    description: "Contact is Favourite"
    type: boolean
    example: true
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  userId:
    description: "Contact's userId"
    type: string
    example: 9904decdd286b30065d54af9
