tags:
  - Contacts
summary: Upsert contact by id
operationId: UpsertContact
description: 'Upsert contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone Number"
            type: string
            example: "+380980001122"
          email:
            description: "Contact's email"
            type: string
            example: "qwert@gmail.com"
          isFavourite:
            description: "Contact is Favourite"
            type: boolean
            example: true
          contactType:
            description: "Contact's type"
            type: string
            enum: ['personal', 'home', 'work']
            example: 'home'
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: 'Upserted contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully upserted a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'